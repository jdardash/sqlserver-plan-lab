name: lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Start SQL Server
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' planlab-mssql)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker inspect --format '{{.State.Health.Status}}' planlab-mssql | grep -q healthy

      # Seed before the tests, not after. The measurement tests exercise the
      # harness against the real database rather than a mock, so PlanLab has to
      # exist first. Running them earlier passes on a developer machine where
      # the database is left over from a previous run, and fails on a clean
      # one, which is precisely the bug CI is here to catch.
      - name: Seed
        run: python -m lab seed

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Reproduce every pathology
        run: python -m lab run

      # Deliberately no check that the committed README matches this run.
      # Logical reads are deterministic, but the elapsed-time column is not, so
      # such a check would fail on every run regardless of correctness. The
      # reproduce step above is the real gate: it fails if any pathology stops
      # cutting logical reads by the required factor.

      - name: Upload captured plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-plans
          path: results/*.sqlplan
